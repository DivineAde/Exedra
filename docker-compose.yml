version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: whiteboard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: whiteboard
      POSTGRES_PASSWORD: whiteboard
      POSTGRES_DB: whiteboard
    ports:
      - "5432:5432"
    volumes:
      - whiteboard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whiteboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: whiteboard_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - whiteboard_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  whiteboard_postgres_data:
  whiteboard_redis_data:
